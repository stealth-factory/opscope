# Start a release: bump the manifest, commit it, tag it, push.
#
# release.yml does the building and publishing, and fires on the tag this
# pushes. Splitting it in two is what makes both halves honest.
#
# The alternative was one workflow that edits Cargo.toml as it builds, and
# release.yml's own comment says why not: a build that rewrites the source
# it is compiling produces a binary that no checkout reproduces. So the
# bump happens here, in a real commit on main, and the tag points at it.
# By the time release.yml looks, the manifest and the tag already agree -
# its "tag and manifest must agree" check is then a guard against somebody
# tagging by hand, which is still allowed and still works.
name: cut-release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version moves'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: 'Work out the version and stop, changing nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, because the next version is worked out from
          # the tags and there may be none at all.
          fetch-depth: 0

      - name: Only from main
        run: |
          # A tag cut from a branch would build code that is not on main and
          # then sit in the release list looking official.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "cut-release runs on main; this is $GITHUB_REF" >&2
            exit 1
          fi

      - name: Work out the next version
        id: next
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$current" ]; then
            echo "no version in Cargo.toml" >&2; exit 1
          fi
          IFS=. read -r major minor patch <<<"$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          next="${major}.${minor}.${patch}"
          # A tag that already exists means someone has been here before,
          # and force-moving a release tag rewrites what people downloaded.
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "v${next} already exists" >&2; exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "$current -> $next"

      - name: What this release would say
        run: |
          # The same script release.yml uses, run against the version about
          # to be cut, so the notes can be read before anything is pushed.
          ./.github/changelog.sh "HEAD" "$(git describe --tags --abbrev=0 2>/dev/null || true)" \
            | head -60

      - name: Stop here
        if: ${{ inputs.dry-run }}
        run: |
          echo "dry run: would have cut v${{ steps.next.outputs.next }}"
          exit 0

      - name: Bump, commit, tag, push
        if: ${{ !inputs.dry-run }}
        env:
          NEXT: ${{ steps.next.outputs.next }}
          CURRENT: ${{ steps.next.outputs.current }}
        run: |
          set -euo pipefail
          # Only the first version key, which is the workspace package's.
          # A blind global replace would also rewrite a dependency pinned at
          # the same number.
          sed -i "0,/^version = \"$CURRENT\"$/s//version = \"$NEXT\"/" Cargo.toml
          grep -q "^version = \"$NEXT\"$" Cargo.toml || {
            echo "the manifest did not take the bump" >&2; exit 1; }

          # Cargo.lock carries the workspace crates' own versions too, and a
          # lock file disagreeing with its manifest makes the next build
          # rewrite it as a stray diff.
          cargo update --workspace --offline 2>/dev/null || cargo update --workspace

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          # printf, not a heredoc: the indentation that keeps the heredoc
          # inside this YAML block scalar would land in the commit message
          # as ten leading spaces on every line. An unindented heredoc body
          # ends the block scalar instead, which is a parse error. printf
          # sidesteps both.
          printf '%s\n' \
            "release: v${NEXT}" \
            "" \
            "The manifest moves ahead of the tag so the tag can point at a" \
            "commit whose version already matches it. release.yml checks" \
            "that they agree and refuses to build if they do not, which is" \
            "only a meaningful check when nothing in the pipeline is" \
            "allowed to edit the manifest on the way past." \
            "" \
            "Cut by the cut-release workflow." \
            | git commit -F -
          # Annotated, so `git describe` sees it and the changelog can find
          # the previous release.
          git tag -a "v${NEXT}" -m "v${NEXT}"
          # The commit first: a tag arriving before the commit it names
          # triggers release.yml against a ref the runner cannot check out.
          git push origin main
          git push origin "v${NEXT}"
          echo "pushed v${NEXT}; release.yml takes it from here"

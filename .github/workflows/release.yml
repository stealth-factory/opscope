# A tag produces a release: three platforms' binaries, their checksums, and
# a changelog built from the commit subjects since the last tag.
#
# Nothing here rewrites the source it is building. The version in Cargo.toml
# and the tag are checked against each other and the build stops if they
# disagree, rather than the workflow editing the manifest to make them match
# - a build that edits its own source produces a binary no checkout can
# reproduce, which is a strange thing to hand somebody. cut-release.yml does
# the bump, in a real commit, before the tag exists.
name: release

on:
  push:
    tags: ['v*']
  # So the build can be exercised without cutting a release. Everything runs
  # except the publish job, which is gated on a tag ref rather than on the
  # trigger - neither of these can publish even by accident.
  workflow_dispatch:
  # And on any change to the release machinery itself, because the first
  # time a release build runs should not be the release. Deliberately not
  # every pull request: this is three full builds and most changes here
  # cannot affect it.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/changelog.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Every platform reports, rather than the first failure hiding the
      # others. When something breaks on one arch it is worth knowing
      # whether it broke on all three.
      fail-fast: false
      matrix:
        include:
          # Pinned, not `-latest`. The oldest glibc a binary runs on is the
          # one it was built against, so that is a decision rather than
          # something to inherit from whatever the runner image became this
          # month. 22.04 is glibc 2.35.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          # macos-14 is Apple Silicon, macos-13 is Intel. Both are pinned
          # for the same reason: `macos-latest` has silently changed arch
          # before, which would swap what an artefact contains without the
          # name changing.
          - target: aarch64-apple-darwin
            runs-on: macos-14
          - target: x86_64-apple-darwin
            runs-on: macos-13
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: re-running this
      # workflow on the same release tag could execute different action code
      # than the release was built with, which makes "reproducible" a word
      # rather than a property. Comments carry the human-readable version so
      # a reader can tell what these are without resolving them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The changelog reads the history between two tags, and the build
          # stamps the commit into --version. A shallow clone has neither.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # An exact version, for the same reason. `stable` moves, and two
          # builds of one tag compiled by different compilers are two
          # different binaries wearing one version number.
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          key: ${{ matrix.target }}

      - name: The tag and the manifest must agree
        # Only meaningful on a tag; a dispatch has no version to check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag but Cargo.toml says $manifest" >&2
            echo "cut-release.yml bumps the manifest in a commit and tags" >&2
            echo "that commit, rather than having this workflow rewrite the" >&2
            echo "source it is building" >&2
            exit 1
          fi
          echo "v$tag"

      - name: The release profile still unwinds
        run: |
          # Three widgets wrap their poll thread in catch_unwind and record
          # why it stopped. Under panic = "abort" those arms are unreachable
          # and the source reads as protected while the binary is not - it
          # was shipped that way once. Costs about 4.5% of the total size,
          # measured.
          grep -q '^panic = "unwind"$' Cargo.toml || {
            echo "Cargo.toml no longer sets panic = unwind" >&2; exit 1; }
          # And nothing here may quietly override it.
          if [ -n "${RUSTFLAGS:-}" ]; then
            echo "RUSTFLAGS is set ($RUSTFLAGS) and could undo the profile" >&2
            exit 1
          fi

      - run: cargo test --release --target ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Nothing dynamic beyond the C runtime
        shell: bash
        run: |
          # rusqlite is taken with `bundled` so SQLite is compiled in, and
          # the promise on the tin is that a binary needs nothing installed
          # alongside it. Checked rather than asserted: a crate that starts
          # wanting a system library would otherwise ship quietly.
          #
          # The two platforms name their own runtime differently and are
          # asked with different tools, so the allowance is per-platform
          # rather than one list that has to be loose enough for both.
          case "${{ runner.os }}" in
            Linux)
              tool="ldd"
              allowed='linux-vdso|libc\.so|libm\.so|libgcc_s\.so|ld-linux'
              ;;
            macOS)
              # otool lists the binary's own path on the first line, hence
              # the tail below.
              #
              # By location, not by name. Everything under /usr/lib and
              # /System/Library ships with macOS and is present on any Mac -
              # libSystem carries libc, libm and the pthreads, and chrono's
              # clock feature reaches CoreFoundation through iana-time-zone
              # to read the system timezone. What this is actually looking
              # for is a dylib the user would have to install, and those
              # live somewhere else: /opt/homebrew/lib/libsqlite3.dylib is
              # the exact thing that must never appear here, because
              # rusqlite is taken with `bundled` so that it does not.
              #
              # An earlier version listed dylib names instead and failed on
              # CoreFoundation, which is not a leak. Naming what is allowed
              # meant guessing the whole list correctly from another
              # platform; naming where it may come from does not.
              tool="otool -L"
              allowed='^\s*/usr/lib/|^\s*/System/Library/'
              ;;
          esac
          bad=0
          for b in target/${{ matrix.target }}/release/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            case "$b" in *.d|*.rlib|*.dSYM) continue ;; esac
            leaked=$($tool "$b" 2>/dev/null | tail -n +2 \
                     | grep -vE "$allowed" | grep -v '^[[:space:]]*$' || true)
            if [ -n "$leaked" ]; then
              # stdout as well as stderr: reading a failed job's log needs
              # admin rights on the repository, and the first time this
              # fired the reason was not visible to the person who wrote it.
              echo "$(basename "$b") links something it should carry:"
              echo "$leaked"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: It runs, and says what it is
        shell: bash
        run: |
          # A binary that builds and cannot start is not an artefact. Only
          # meaningful where the runner can execute what it just built,
          # which is every entry in this matrix today.
          out=$(./target/${{ matrix.target }}/release/start --version)
          echo "$out"
          case "$out" in
            *unknown*) echo "the build stamp did not resolve" >&2; exit 1 ;;
          esac

      - name: A tarball, and its checksum
        shell: bash
        run: |
          # On a tag this is v0.2.0; on a pull request it is "41/merge",
          # whose slash would become a directory in the tarball. Anything
          # that is not a version is just called dev.
          case "${GITHUB_REF_NAME}" in
            v[0-9]*) version="${GITHUB_REF_NAME}" ;;
            *)       version="dev" ;;
          esac
          name="terminal-toys-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The binaries, and the docs that explain them - `start` embeds
          # them but a person reading the tarball has no other copy.
          for b in target/${{ matrix.target }}/release/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            case "$b" in *.d|*.rlib|*.dSYM) continue ;; esac
            cp "$b" "dist/$name/"
          done
          cp -r docs README.md LICENSE config.example.json "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          # shasum is on both; sha256sum is not on macOS.
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            terminal-toys-*.tar.gz
            terminal-toys-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    # A tag, and only a tag. A manual dispatch exercises the whole build and
    # stops here, so the workflow can be tested without leaving a release
    # behind under a version nobody meant to cut.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Changelog
        run: ./.github/changelog.sh "$GITHUB_REF_NAME" > CHANGELOG-release.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG-release.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256

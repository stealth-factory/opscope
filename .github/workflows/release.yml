# A tag produces a release: three platforms' binaries, their checksums, and
# a changelog built from the commit subjects since the last tag.
#
# Nothing here rewrites the source it is building. The version in Cargo.toml
# and the tag are checked against each other and the build stops if they
# disagree, rather than the workflow editing the manifest to make them match
# - a build that edits its own source produces a binary no checkout can
# reproduce, which is a strange thing to hand somebody. release-pr.yml does
# the bump, in a real commit, before the tag exists.
name: release

on:
  push:
    tags: ['v*']
  # Two uses. Dispatching at a branch exercises the whole build without
  # cutting a release, because the publish job is gated on the ref being a
  # tag. Dispatching at a tag does publish, and is how tag-release.yml
  # starts this workflow: a tag it pushes with GITHUB_TOKEN triggers
  # nothing, and workflow_dispatch is the documented exception.
  workflow_dispatch:
  # And on any change to the release machinery itself, because the first
  # time a release build runs should not be the release. Deliberately not
  # every pull request: this is three full builds and most changes here
  # cannot affect it.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'cliff.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # Every platform reports, rather than the first failure hiding the
      # others. When something breaks on one arch it is worth knowing
      # whether it broke on all three.
      fail-fast: false
      matrix:
        include:
          # Pinned, not `-latest`. The oldest glibc a binary runs on is the
          # one it was built against, so that is a decision rather than
          # something to inherit from whatever the runner image became this
          # month. 22.04 is glibc 2.35.
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
          # Both macOS arches are built on one Apple Silicon runner.
          #
          # macos-13, the Intel image, is retired: a job asking for it
          # queues forever, which is what the first three runs of this
          # workflow did while the other two got runners in seconds. The
          # Intel images that replaced it are `-large` runners and bill
          # even on a public repository, where the standard ones are free.
          #
          # Cross-compiling costs nothing and Apple's toolchain does it
          # natively - an arm64 Mac has always been able to target x86_64.
          # What it cannot do is run the result, so the x86_64 binaries are
          # built and packaged but their tests are not executed here. That
          # is stated rather than hidden: `cross: true` is what turns those
          # steps off, and TOY-40 already owns "what actually works on a
          # Mac" as a question.
          #
          # macos-15 rather than macos-14: 14 is deprecated, and this is a
          # pin either way, because `macos-latest` has silently changed
          # arch before and would swap an artefact's contents without its
          # name changing.
          - target: aarch64-apple-darwin
            runs-on: macos-15
          - target: x86_64-apple-darwin
            runs-on: macos-15
            cross: true
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: re-running this
      # workflow on the same release tag could execute different action code
      # than the release was built with, which makes "reproducible" a word
      # rather than a property. Comments carry the human-readable version so
      # a reader can tell what these are without resolving them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The changelog reads the history between two tags, and the build
          # stamps the commit into --version. A shallow clone has neither.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # An exact version, for the same reason. `stable` moves, and two
          # builds of one tag compiled by different compilers are two
          # different binaries wearing one version number.
          toolchain: "1.98.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          key: ${{ matrix.target }}

      - name: The tag and the manifest must agree
        # Only meaningful on a tag; a dispatch has no version to check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$manifest" ]; then
            echo "tag v$tag but Cargo.toml says $manifest" >&2
            echo "release-pr.yml bumps the manifest in a commit, and" >&2
            echo "tag-release.yml tags that commit, rather than having" >&2
            echo "this workflow rewrite the source it is building" >&2
            exit 1
          fi
          echo "v$tag"

      - name: The release profile still unwinds
        run: |
          # Three widgets wrap their poll thread in catch_unwind and record
          # why it stopped. Under panic = "abort" those arms are unreachable
          # and the source reads as protected while the binary is not - it
          # was shipped that way once. Costs about 4.5% of the total size,
          # measured.
          grep -q '^panic = "unwind"$' Cargo.toml || {
            echo "Cargo.toml no longer sets panic = unwind" >&2; exit 1; }
          # And nothing here may quietly override it.
          if [ -n "${RUSTFLAGS:-}" ]; then
            echo "RUSTFLAGS is set ($RUSTFLAGS) and could undo the profile" >&2
            exit 1
          fi

      - name: Tests
        # Skipped for the cross-compiled target, which this runner cannot
        # execute. The same sources are tested on the native arm64 leg in
        # the same run, so the code is covered; what is not covered is
        # x86_64-specific behaviour, and there is none in this tree that
        # the arm64 build would not also show.
        if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Nothing dynamic beyond the C runtime
        shell: bash
        run: |
          # rusqlite is taken with `bundled` so SQLite is compiled in, and
          # the promise on the tin is that a binary needs nothing installed
          # alongside it. Checked rather than asserted: a crate that starts
          # wanting a system library would otherwise ship quietly.
          #
          # The two platforms name their own runtime differently and are
          # asked with different tools, so the allowance is per-platform
          # rather than one list that has to be loose enough for both.
          case "${{ runner.os }}" in
            Linux)
              tool="ldd"
              allowed='linux-vdso|libc\.so|libm\.so|libgcc_s\.so|ld-linux'
              ;;
            macOS)
              # otool lists the binary's own path on the first line, hence
              # the tail below.
              #
              # By location, not by name. Everything under /usr/lib and
              # /System/Library ships with macOS and is present on any Mac -
              # libSystem carries libc, libm and the pthreads, and chrono's
              # clock feature reaches CoreFoundation through iana-time-zone
              # to read the system timezone. What this is actually looking
              # for is a dylib the user would have to install, and those
              # live somewhere else: /opt/homebrew/lib/libsqlite3.dylib is
              # the exact thing that must never appear here, because
              # rusqlite is taken with `bundled` so that it does not.
              #
              # An earlier version listed dylib names instead and failed on
              # CoreFoundation, which is not a leak. Naming what is allowed
              # meant guessing the whole list correctly from another
              # platform; naming where it may come from does not.
              tool="otool -L"
              allowed='^\s*/usr/lib/|^\s*/System/Library/'
              ;;
          esac
          bad=0
          for b in target/${{ matrix.target }}/release/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            case "$b" in *.d|*.rlib|*.dSYM) continue ;; esac
            leaked=$($tool "$b" 2>/dev/null | tail -n +2 \
                     | grep -vE "$allowed" | grep -v '^[[:space:]]*$' || true)
            if [ -n "$leaked" ]; then
              # stdout as well as stderr: reading a failed job's log needs
              # admin rights on the repository, and the first time this
              # fired the reason was not visible to the person who wrote it.
              echo "$(basename "$b") links something it should carry:"
              echo "$leaked"
              bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: It runs, and says what it is
        # Same reason: an x86_64 binary will not start on this host.
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          # A binary that builds and cannot start is not an artefact. Only
          # meaningful where the runner can execute what it just built,
          # which is every entry in this matrix today.
          #
          # Every binary, found by looking rather than named here. This step
          # used to run one, by name, and when that one was renamed the step
          # kept pointing at a path that no longer existed - which surfaced
          # as `No such file or directory` at release time, on a change that
          # had passed every other check. Nothing here knows what the
          # binaries are called, so nothing here can go stale.
          n=0
          for b in target/${{ matrix.target }}/release/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            case "$b" in *.d|*.rlib|*.dSYM) continue ;; esac
            out=$("$b" --version)
            echo "$out"
            case "$out" in
              *unknown*)
                echo "the build stamp did not resolve for $b" >&2; exit 1 ;;
            esac
            n=$((n + 1))
          done
          # And a count, because a glob that matches nothing would otherwise
          # let this step pass having tested nothing at all.
          if [ "$n" -lt 14 ]; then
            echo "only $n binaries ran; expected all 14" >&2
            exit 1
          fi
          echo "$n binaries ran and reported themselves"

      - name: A tarball, and its checksum
        shell: bash
        run: |
          # On a tag this is v0.2.0; on a pull request it is "41/merge",
          # whose slash would become a directory in the tarball. Anything
          # that is not a version is just called dev.
          case "${GITHUB_REF_NAME}" in
            v[0-9]*) version="${GITHUB_REF_NAME}" ;;
            *)       version="dev" ;;
          esac
          name="opscope-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          # The binaries, and the docs that explain them - `opscope` embeds
          # them but a person reading the tarball has no other copy.
          for b in target/${{ matrix.target }}/release/*; do
            [ -f "$b" ] && [ -x "$b" ] || continue
            case "$b" in *.d|*.rlib|*.dSYM) continue ;; esac
            cp "$b" "dist/$name/"
          done
          cp -r docs README.md LICENSE config.example.json "dist/$name/"
          tar -C dist -czf "$name.tar.gz" "$name"
          # shasum is on both; sha256sum is not on macOS.
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          ls -la "$name.tar.gz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: |
            opscope-*.tar.gz
            opscope-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    # A tag, and only a tag - whatever started the run. Dispatching at a
    # branch exercises the whole build and stops here, so the workflow can
    # be tested without leaving a release behind under a version nobody
    # meant to cut. Dispatching at a tag is a real release, and is how
    # tag-release.yml gets here.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Notes for this release
        run: |
          # The top section of CHANGELOG.md, which release-pr.yml wrote
          # when it prepared this version. Taking it from the file rather
          # than regenerating means the notes on the release are the same
          # text that was reviewed in the release PR, character for
          # character - a changelog regenerated here could differ if a
          # commit landed in between.
          awk '/^## \[/{n++} n==1' CHANGELOG.md > CHANGELOG-release.md
          if [ ! -s CHANGELOG-release.md ]; then
            echo "no section found in CHANGELOG.md for this release" >&2
            exit 1
          fi
          cat CHANGELOG-release.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file CHANGELOG-release.md \
            artifacts/*.tar.gz artifacts/*.tar.gz.sha256

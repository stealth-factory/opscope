# Builds and tests every pull request.
#
# Until this existed, nothing did. CodeQL read the workflows and a title
# check read the title; no job compiled the tree, so a pull request could
# go green on a change that did not build. The only thing running
# `cargo test` was release.yml, which fires on a tag - meaning the first
# time anything ran the tests was after the version had been decided and
# the release notes written.
#
# That matters more here than in most repositories, because
# widgets/tests/check.rs is not a unit test suite. It checks the things
# the compiler cannot - a footer naming a key nothing answers, a config
# key missing from the example, text failing contrast on a selected row -
# and every check in it exists because something shipped broken and looked,
# on screen, exactly like "there is no data". A check nobody runs is prose.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to a pull request cancels the first: nobody needs the
# results of a commit that has already been replaced.
#
# Never on main, though. A run there is the only record that a commit was
# built and tested, and one of them was cancelled seconds after it started
# - leaving a commit on main with no evidence either way, which is the same
# silence this repo spends so much effort not shipping. Every commit that
# lands gets its own verdict, even if three land in a minute.
#
# The group names the pull request explicitly rather than leaning on
# github.ref, which is a different shape for each event and easy to collide
# by accident.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # The same exact version release.yml builds with. A pull request
          # that passes here and fails at release time on a compiler
          # difference is the one outcome this job exists to prevent.
          toolchain: "1.98.0"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2

      - name: Tests
        # Debug, not release. release.yml covers the release profile on
        # three platforms; this is the fast gate, and the checks that matter
        # most here read source files rather than run compiled code.
        run: cargo test --workspace --all-targets

      - name: It builds
        # --all-targets above builds the test harnesses but not necessarily
        # every binary as a binary. Sixteen of them ship; all sixteen
        # should compile before a change is merged.
        run: cargo build --workspace --bins

      - name: The npm packages pack and fail clearly
        # cargo test already runs npm/test.js via widgets/tests/npm.rs
        # when node is on PATH, which this runner has. Said again here
        # so a future change that drops that rust test cannot make the
        # packer untested: these are the checks that a missing tarball
        # or an unsupported platform still fail with a sentence.
        run: node --test npm/test.js

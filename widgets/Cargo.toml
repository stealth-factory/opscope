[package]
name = "opscope-widgets"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A version alongside the path, because cargo refuses to package a
# dependency that has no version requirement. release-pr.yml bumps this
# line in the same step as the workspace version, so the two crates cannot
# drift apart - they are one product and are versioned together.
opscope-core = { path = "../core", version = "0.5.0" }
libc = "0.2"
serde_json = "1"
# clocks needs these; nothing else does yet, and an unused dependency costs
# nothing at run time because LTO drops what no binary reaches.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
# agent-usage reads three of its six agent vendors out of SQLite files, which is
# what Cursor, Copilot and Antigravity each keep their history in. Python
# has sqlite3 in its standard library; this is the equivalent, bundled so
# that the binary still runs on a machine with no sqlite installed - the
# single executable being the point of the port.
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "ports"
path = "src/widgets/ports/main.rs"

[[bin]]
name = "netwatch"
path = "src/widgets/netwatch/main.rs"

[[bin]]
name = "latency"
path = "src/widgets/latency/main.rs"

[[bin]]
name = "matrix"
path = "src/widgets/matrix/main.rs"

[[bin]]
name = "link"
path = "src/widgets/link/main.rs"

[[bin]]
name = "clocks"
path = "src/widgets/clocks/main.rs"

[[bin]]
name = "herdr-panes"
path = "src/widgets/herdr-panes/main.rs"

[[bin]]
name = "deployments"
path = "src/widgets/deployments/main.rs"

# The launcher, and the command the project is named after. One word, like
# htop and btop, because that is what somebody types first.
[[bin]]
name = "opscope"
path = "src/launcher/main.rs"

[[bin]]
name = "linear"
path = "src/widgets/linear/main.rs"

[[bin]]
name = "github-prs"
path = "src/widgets/github-prs/main.rs"

[[bin]]
name = "github"
path = "src/widgets/github/main.rs"

[[bin]]
name = "github-actions"
path = "src/widgets/github-actions/main.rs"

[[bin]]
name = "tailnet"
path = "src/widgets/tailnet/main.rs"

[[bin]]
name = "agent-usage"
path = "src/widgets/agent-usage/main.rs"

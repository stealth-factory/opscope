# How the changelog is built, and what decides the version.
#
# git-cliff reads the conventional commits since the last tag. It never
# runs cargo, which is why it is here: release-plz determines what changed
# by running `cargo package --verify`, and this workspace cannot be
# packaged - opscope.rs embeds the repo's own docs with
# include_str!("../../../docs/clocks.md"), reaching outside the crate, so a
# packaged opscope-widgets has no docs/ and will not compile. There is no
# option to skip that step.
#
# Squash merge means the PR title is the commit subject, so these rules are
# really rules about PR titles. A check on the pull request enforces them.

[changelog]
header = """
# Changelog

Every release, and what changed in it. Generated from the commit subjects,
which is why they are worth writing carefully.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} — **breaking**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# A commit that is not conventional still appears, under "Other", rather
# than vanishing. This repo has ~200 prose commits behind it and the
# baseline tag keeps them out of any changelog - but a stray one after
# that should be visible rather than silently dropped, because a changelog
# that quietly omits a change is worse than an untidy one.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true

# Grouped by what a reader wants to find, in the order they want it. Plain
# words rather than emoji: these show up in a terminal as often as a
# browser, and the release notes are read next to widgets that are careful
# about what renders where.
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  # The release commits this machinery makes itself. Keeping them would
  # mean every changelog opening with a note that the last changelog was
  # written.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^release:", skip = true },
  { message = "^chore\\(deps\\)", group = "Dependencies" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^style", group = "Miscellaneous" },
  { message = "^revert", group = "Reverted" },
  { body = ".*security", group = "Security" },
]

filter_commits = false
topo_order = false
sort_commits = "oldest"

[bump]
# feat -> minor, fix -> patch, breaking -> major. Below 1.0.0 a breaking
# change moves the minor rather than the major, which is semver's own rule
# for 0.x and the reason this project can still make breaking changes
# without claiming to be 1.0.
features_always_bump_minor = true
breaking_always_bump_major = false

[workspace]
resolver = "2"
members = ["core", "widgets"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Thirteen of these run at once, so size is worth more here than the last
# few percent of speed: optimise for it, strip symbols, and let LTO drop
# everything nothing reaches.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# unwind, deliberately, and not for free: it costs about 0.5 MB across the
# widget binaries, 4.5%, measured. It buys the poller guards in agent-usage,
# herdr-panes and ports, which wrap their poll threads in catch_unwind and
# record why they stopped. Under panic = "abort" those guards cannot fire
# at all - the process dies before the Err arm is reached - so the source
# read as protected while the shipped binary had no protection, and the
# tests exercised a path that only exists in the test profile. CLAUDE.md
# asks that every poller record why it stopped; this is what makes that
# true rather than aspirational. Setting this back to "abort" silently
# deletes three error paths.
panic = "unwind"
strip = true
